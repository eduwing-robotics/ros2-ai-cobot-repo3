# amqtt 브로커 설정 —  ../../bin/amqtt -c broker.yaml
#
# ⚠ bind 주소가 관제 서버 연동의 갈림길이다.
#     127.0.0.1  이 PC 안에서만 접속된다. 개발·시연용.
#     0.0.0.0    다른 PC(관제 서버)에서 접속된다. 아래 주석을 바꿔 쓴다.
#   포트 1883 이 방화벽에서 열려 있어야 한다:  sudo ufw allow 1883/tcp
#
# ⚠ allow-anonymous: true 는 인증이 없다는 뜻이다. 폐쇄망 시연 전제다.
#   외부에 열 때는 계정과 TLS 를 붙여야 한다.
listeners:
  default:
    type: tcp
    # 2026-09-09: 브로커를 이 PC 에 두기로 정했다. 관제 서버가 다른 PC 에서
    # 붙어야 하므로 모든 네트워크 카드에서 접속을 받는다.
    #   이 PC 주소 192.168.30.13 — 관제 쪽은 --host 192.168.30.13 으로 붙는다.
    # 이 PC 안에서만 쓸 때로 되돌리려면 127.0.0.1:1883 으로 바꾼다.
    bind: 0.0.0.0:1883
auth:
  allow-anonymous: true
