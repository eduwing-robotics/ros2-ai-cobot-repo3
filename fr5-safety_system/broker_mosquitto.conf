# mosquitto 설정 — /etc/mosquitto/conf.d/ai_safety.conf 로 복사한 뒤
#   sudo systemctl restart mosquitto
#
# 기본 설치는 127.0.0.1 만 듣는다. 관제 서버가 다른 PC 면 아래가 필요하다.
listener 1883 0.0.0.0

# ⚠ 인증 없음 — 폐쇄망 시연 전제다. 외부 개방 시 password_file 과 TLS 를 붙여라.
allow_anonymous true

# 상태 토픽은 변화 시에만 발행되므로 retain 이 필수다(기본 허용).
# 구독자가 접속하는 순간 현재 상태를 한 번 받는 근거가 이것이다.
