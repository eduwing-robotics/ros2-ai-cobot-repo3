<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>맵을 실제 바닥에 얹는다</title>
  <link rel="stylesheet" href="/src/screens/xr.css">
</head>
<body>
  <!-- **고를 것이 둘뿐이다** — 무엇을 할까(모드)와 어느 맵인가. 팔 대수·애니메이션은
       사람이 고를 값이 아니라 맵이 정한다(`cell` FR5 3대 · `empty` 1대). 골라서 얻는 게
       없는 선택지는 화면에서 뺀다. -->
  <div id="app">
    <!-- 배경은 **진짜 3D 다.** 고른 맵이 천천히 돌아 "무엇을 얹게 되는지" 를 먼저 보여준다.
         `layout-view.js` 의 `updateCutaway` 가 카메라 쪽 벽을 숨겨 안이 보인다 — 이 화면이
         그 기능을 처음 쓴다. -->
    <div id="preview"></div>

    <div id="topbar">
      <span id="dot" aria-hidden="true"></span>
      <p id="sup">확인 중…</p>
    </div>

    <!-- 조작은 전부 아래에 모은다 — 폰을 고쳐 잡지 않고 엄지로 닿는다. -->
    <div id="sheet">
      <div id="grab" aria-hidden="true"></div>
      <div id="chips" role="group" aria-label="모드"></div>
      <p id="blurb"></p>
      <label class="field" for="preset">맵
        <select id="preset"></select>
      </label>
      <button id="go" type="button" disabled>AR 시작</button>
      <div id="more">
        <button id="logBtn" type="button" aria-expanded="false" aria-controls="log">기록 보기</button>
        <button id="copy" type="button">결과 복사</button>
      </div>
      <div id="log" hidden></div>
    </div>
  </div>

  <!-- **오버레이 루트는 화면을 덮으면 안 된다.** 덮으면 탭을 DOM 이 먹어 XR `select` 가
       안 온다 (2026-08-04 실측 — 탭이 하나도 안 들어왔다). 그래서 크기 0 껍데기를 루트로
       주고, 안의 것들만 `position:fixed` 로 띄운다. 조작바는 `beforexrselect` 로
       그 위 탭만 DOM 이 가져가게 한다. -->
  <div id="ov">
    <div id="hud"></div>
    <div id="fps"></div>
    <div id="steps" hidden><span class="step"></span><span class="step"></span></div>
    <div id="hint"></div>
    <div id="bar" hidden>
      <button id="zoomOut" type="button" aria-label="줄이기">축소</button>
      <button id="zoomIn" type="button" aria-label="키우기">확대</button>
      <button id="rotL" type="button" aria-label="왼쪽으로 90도 돌리기">↺</button>
      <button id="rotR" type="button" aria-label="오른쪽으로 90도 돌리기">↻</button>
      <button id="again" type="button" aria-label="처음부터 다시 놓기">다시 놓기</button>
      <!-- 시뮬 재생 — MuJoCo 배치 한 벌(Shared/assets/sim/replay.json)을 팔에 얹는다. 실기 라이브가 오면 그쪽이 이긴다 -->
      <button id="replay" type="button" aria-pressed="false" aria-label="시뮬 궤적 재생">시뮬 재생</button>
      <button id="exit" type="button" hidden aria-label="화면 모드 나가기">나가기</button>
    </div>
  </div>

  <script type="module" src="/src/screens/xr.js"></script>
</body>
</html>
