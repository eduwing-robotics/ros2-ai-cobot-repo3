    follow:
      # ── 무엇을 따라가나 (계약 §무엇을 따라가나 · 2026-09-04 신설) ──────────────
      # 예전엔 표적이 코드에 `AMR_TAG_ID = 18` 로 박혀 있어 **터틀봇밖에 못 따라갔다.**
      # 첫 실사용은 거치대다 — 주인님이 총알 거치대를 아무 데나 놓으면 팔이 그 위로 간다.
      # ⭐ **2026-09-04 저녁 — 15(거치대) → 18(터틀봇).** 창구를 `wrist` 로 바꾸면서다.
      # 손목 뎁스는 **거치대를 못 잡는다** — 구멍 판이라 구멍마다 스테레오가 깨져 평면 RMS
      # 13mm 에 「솟은 것이 없다」가 나온다(09-04 실측). 라이다 윗면은 같은 프레임에서
      # 지름 106mm 로 잡힌다. **재는 것과 집는 것을 가른다** (계약 §`wrist`).
