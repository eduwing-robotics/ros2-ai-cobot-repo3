    # 로봇으로 짚어 만든 참값이 오염돼 있었다(게이트에 막혀 7.6mm 위에서 · 길이 77mm 중
    # 어디인지 모름). 근거 `docs/evidence/2026-08-13/handeye-no-touch.md`.
