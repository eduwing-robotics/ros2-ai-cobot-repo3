      # ⭐ **2026-09-04 에 165 → 220 으로 올렸다. 값이 자기 주석의 의도를 못 지키고 있었다.**
      # 165 는 *"카메라 최적 250 − hand-eye 85"* 로 잡은 값인데, 그건 **표적 평면**을 볼 때다.
      # 지금 표적은 **판 위에 누운 종이 태그**이고 정작 보려는 거치대는 그보다 **47~55mm
      # 더 높다** — 그 키만큼 카메라가 가까워진다.
      #   165 → 카메라~거치대 윗면 **192mm**(자 55) / 199mm(뎁스 47.3)
