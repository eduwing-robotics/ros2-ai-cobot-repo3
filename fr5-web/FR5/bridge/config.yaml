      # 이미 표적 z 에 들어 있다. 안 빼면 55mm 만큼 멀리 서서 카메라가 302mm 가 된다
      # (잘 되는 구간 232~273 밖). 165 → **247mm** — 한복판이다.
      # ⭐ **2026-09-04 저녁 — 165 → 220. 표적이 라이다 윗면이 됐다.**
      # 165 는 **거치대 윗면** 기준이다. 라이다 윗면은 그보다 77mm 높아 카메라가 D435 의
      # Min-Z **195mm** 안으로 들어가고, 그러면 덩어리가 통째로 잘린다(2026-08-12 에 그
      # 병으로 92.35mm 라는 「우연히 맞은 잘린 값」이 나왔다). 220 → 카메라 **247mm** 로
      # 08-13 에 잘 됐던 구간(232~273 · SNR 61~140) 한복판이다.
      standoffMm: 220.0
      # 어느 면을 마주보나 — `z` 위에서 · `y` 옆에서.
      # ⭐ **세워 꽂으면 `y` 로 바꾼다** (D122 — 위에서는 지름이 5.8화소라 못 본다).
      # 이 한 글자가 「눕힘 ↔ 세움」 전환의 전부가 되도록 코드를 일반화해 둔다.
      #
      # **2026-08-27 에 `y` 로 바꿨다** — 주인님이 *「총알은 세워진 상태여야 하고 세워진 걸
      # 집을 수도 있어야 한다」* 로 확정하셨다. 눕힘은 더 이상 정본이 아니다.
      # ⚠ **이 값은 「어느 면을 마주보고 다가가나」이지 「어떻게 검출하나」가 아니다.**
      #    검출 쪽은 따로 막혀 있다 — 세운 총알이 위에서 스테레오 그림자로 자기를 지운다
      #    (받침 21% 무효 · 8개 중 4개만 · `docs/evidence/2026-08-27/standing-bullets-depth-holes.png`).
      # ⚠ **추종은 아직 브리지에 배선돼 있지 않다** — 이 값은 지금 `follow-map.py`(맥)만 읽는다.
      #    배선하는 날 실기로 다시 확인한다 (사다리 7)
      #
      # ⭐ **2026-09-04 에 `z` 로 되돌렸다 — 물체가 바뀌었기 때문이다.**
      # `y` 를 고른 08-27 의 표적은 **세운 총알**이었다. 지금 표적은 **거치대 자체**(판 위
      # 상자)이고, 옆에서 165mm 면 손끝이 **상판 높이에서 옆구리를 찌르는 자세**가 된다 —
      # 위험하고, 상자 안도 못 본다. 주인님이 말한 *"공중에서 정조준"* 이 곧 `z` 다.
      # ⛔ **총알을 다시 따라갈 때는 `y` 로 되돌린다.** 이 값은 표적과 한 몸이다 —
      #    `targetTagId` 를 고치면서 여기를 안 보면 조용히 틀린 면으로 다가간다.
      faceAxis: z
      # 목표가 이만큼 안 움직이면 **안 따라간다.** hand-eye 흩어짐 5.74mm 의 약 2.6배 —
      # 그 아래는 물체가 아니라 **측정 잡음**이 움직인 것이고, 따라가면 팔이 떤다.
      deadbandMm: 15.0
      # 나갈 때 문턱. `deadbandMm` 보다 커야 경계에서 깜빡이지 않는다
      # (`SHARED-CORE.md` §판정 규칙 — AMR 구역에서 같은 문제를 이미 풀었다)
      releaseMm: 25.0
      # 수직에서 이 각도 안. 넘으면 화면에 평면이 둘 되어 검출이 무너진다 —
      # 2026-08-13 실측: 88° 에서 `planeRmsMm` 1.5 → 35.0 · 덩어리 0개
      maxTiltDeg: 20.0
      # 이동 속도. **상한 초과는 게이트가 거부한다** — 여기서 자르지 않는다(자르면 버그가 숨는다)
      speedPct: 10
      # 도착 뒤 이만큼 쉰다 — 다음 측정이 흔들린 프레임을 읽지 않게
      settleMs: 300
      # ⛔ **켠 뒤 이만큼 지나면 스스로 꺼진다** (계약 조건 8).
      # 「사람이 켠다」는 규율이지 안전장치가 아니다 — **끄는 걸 잊는 것이 기본값**이다.
      # 5분이면 한 번의 실험을 덮고, 자리를 뜬 채 도는 시간은 그 안에서 끝난다.
      autoOffAfterS: 300

  # ── 집에서 시뮬 탭을 돌리는 목업 (2026-09-06 · `docs/archive/GRILL-conveyor-twin-progresslog-2026-09-06.md` 결정 #5) ──
  # 실기 `fr5-lab-a` 의 **얼린 좌표계(tool1/user1 · `Sim/fixtures/fr5-lab-a.json`)·작업영역·설정을 빌리고**
  # 팔은 mock 의 URDF 기구학으로 돈다. 그래서 시뮬 탭이 user1 좌표로 묻는 `/ik` 가 집에서도 랩과
  # 같은 자리를 푼다. ⛔ 여기서 나온 관절각·판정은 그림이다 — 실기 근거로 옮겨 적지 않는다.
  - robotId: fr5-mock-lab
    name: 목업 실험실 — 실기 좌표계·작업영역 빌림
    adapter: mock
    endpoint: mock://lab
    fixture: fr5-lab-a           # 얼린 좌표계를 이 로봇 것에서 빌린다 (`robot_adapter/mock.py` `_frozen`)
    expectedModel: FR5           # mock 이 사칭하지 않는 모델 문자열 (VERSION.model)
    borrowFrom: fr5-lab-a      # 작업영역·설정·hand-eye 를 실기 프로필에서 **그대로** 빌린다 (브리지가 로드 때 채운다 · `main.py` _borrow).
                               # ⛔ YAML 앵커를 안 쓴다 — `Sim/scene/build-scene.mjs`·`scripts/check/measurements.mjs` 가 줄 단위 손파서라 `&앵커` 가 붙은 줄을 못 읽는다 (2026-09-06 게이트 4개가 그렇게 붉어졌다)
    # 목업은 **두 눈(거울 쌍)** 으로 둔다 — 시뮬 탭 게이트(sim-tab.mjs ⓑ)가 거울 쌍·자세 B 를 검사한다. 실기는 위 fr5-lab-a 의 singleView 로 한 눈.
    # 자기 값이 있으면 빌림(borrowFrom)이 덮지 않는다 — tMm 은 실기와 같게 두고 표시만 끈다 (2026-09-07)
    handEye:
      tMm: [-10.7, -89.6, -81.7]
      spreadMm: 5.74
      measuredAt: "2026-08-13"
      singleView: false
  - robotId: fr5-mock-a
    name: 목업 A
    adapter: mock
    endpoint: mock://a
    # 게이트 시험용 — mock 의 **URDF 기구학**(2026-09-06 · 전엔 관절→손끝 10mm/° 선형 흉내)에 맞춘 값이다.
    # 실기 셀 값이 아니다. 여기 숫자를 근거로 실기를 판단하지 않는다
    workspace:
      # mock 시작 자세 JOINTS_BASE 의 손끝(플랜지 · base 기준)은 (-171.6, 420.4, 533.9) 이고
      # 툴 꼭짓점은 x -214~-118 · y 390~512 · z 532~670 이다. 그 점을 영역 **안**에 두고,
      # j3 +5°(손끝 z 490 · 손가락 z 489.7 < 510) 면 상판, j2 +5°(어깨가 바깥으로 뻗어 툴 꼭짓점이 벽까지 8mm) 면
      # 벽에 걸리게 잡았다. j1 +1°(손끝 x -178.9) 는 통과한다 — `scripts/check/fr5-bridge-verify.mjs` §작업영역.
      # ⛔ 벽은 **j1 이 못 가는 쪽(+y)** 이다. 검사 스크립트가 j1 을 +30° 까지 돌리는데 손끝은 원점 둘레 반지름
      #    454mm 원을 따라 -x 로만 가므로, -x 쪽 벽은 어디 세워도 앞 검사가 먼저 걸렸다 (2026-09-06 실측).
      #    그리고 벽의 안전한 쪽은 원점 쪽이라 +x(원점과 손끝 사이)에 세우면 전부 「뚫고 반대편」이 된다.
      frame: {toolId: 0, userId: 0}
      measuredAt: "2026-09-06"
      boxes:
        - {name: 상판, xMm: [-500.0, 0.0], yMm: [150.0, 650.0], topZMm: 500.0, marginMm: 10}
      walls:
        - {name: 벽, aMm: [-1000.0, 530.0], bMm: [1000.0, 530.0], marginMm: 10}
    expectedModel: FR5
    settings:
      payloadKg: 0.6
      cogMm: [0, 0, 60]
      installPos: 0
      collisionMode: 0
      collisionLevel: [5, 5, 5, 5, 5, 5]
      collisionStrategy: 2
      collisionSafeTimeMs: 1000
      collisionSafeDistanceMm: 100
      collisionSafeVelMmS: 250
      collisionSafetyMargin: [10, 10, 10, 10, 10, 10]
      toolCoordId: 0
  - robotId: fr5-mock-b
    name: 목업 B — 프로필 교체 시험용
    adapter: mock
    endpoint: mock://b
    expectedModel: FR5
    settings:
      payloadKg: 0.6
      cogMm: [0, 0, 60]
      installPos: 0
      collisionMode: 0
      collisionLevel: [5, 5, 5, 5, 5, 5]
      collisionStrategy: 2
      collisionSafeTimeMs: 1000
      collisionSafeDistanceMm: 100
      collisionSafeVelMmS: 250
      collisionSafetyMargin: [10, 10, 10, 10, 10, 10]
      toolCoordId: 0
  - robotId: fr5-mock-broken
    name: 목업 — 잘못된 모델·누락 필드 (fail-closed 시험용)
    adapter: mock
