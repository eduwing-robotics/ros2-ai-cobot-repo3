  - robotId: fr5-mock-setfail
    name: 목업 — 안전 설정이 안 먹는 로봇 (조건 26 시험용)
    adapter: mock
    endpoint: mock://setfail
    expectedModel: FR5
    settings:
      payloadKg: 0.6
      cogMm: [0, 0, 60]
      installPos: 0
      collisionMode: 0
      collisionLevel: [5, 5, 5, 5, 5, 5]
      collisionStrategy: 2
      collisionSafeTimeMs: 1000
      collisionSafeDistanceMm: 100
      collisionSafeVelMmS: 250
      collisionSafetyMargin: [10, 10, 10, 10, 10, 10]
      toolCoordId: 0
    mock:
      settingsDrift: true   # 넣은 값과 다른 값을 되읽어 준다 → arm 이 거부돼야 한다
