      targetSource: wrist           # wrist = wrist-pose.json · color = carrier-pose.json · anchor = scene-anchors.json · amr = amr-pose.json
      # ⚠ **태그를 거치대 밑에 깔지 않는다** — 물건이 자기 표적을 가린다(주인님 08-31
      #   *"올려놨어 근데 마커가 가려지잖아"*). 받침 태그 id6 이 이미 답을 적어 뒀다:
