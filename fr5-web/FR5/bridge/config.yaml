      singleView: true                # 마법사 ①이 스캔 A 한 번으로 판정 — 거울 쌍(B) 생략. 검산은 「자세히」에서

    # ── 추종 (계약 `VISION-CONTRACT.md` §추종 · D132) ─────────────────────────
