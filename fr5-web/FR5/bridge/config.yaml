    # 풀어야 하고 그건 **점 하나로는 안 된다**(태그처럼 자세를 주는 표적이 필요하다).
    handEye:
      tMm: [-10.7, -89.6, -81.7]  # 2026-09-07 거울 쌍 14눈으로 xy 재보정 — 옛 [-25.9, -76.1] 에 툴 고정 오차 (+15.2, −13.5) 를 더했다
      spreadMm: 5.74            # 흩어짐 — 그리퍼 좌우 여유 ±10mm(D122) 안이라 파지 가능 (08-13 값)
      measuredAt: "2026-08-13"
