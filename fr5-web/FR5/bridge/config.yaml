          # 평면 잔차 17.7mm · 법선이 수직에서 0.7° (수직 벽 가정을 데이터가 스스로 확인했다)
          aMm: [-1422.0, -2385.0]
          bMm: [2254.0, -2539.0]
          marginMm: 100
          seenZMm: [-759.0, 1399.0]   # 본 높이대 (화각 경계 · 위 참조 · 그림 전용)

    # ── 손목 카메라 ↔ 핑거 끝 (hand-eye) ─────────────────────────────────────
