          # **최대 55.3mm 뚫고 있었다.** 주인님이 쌍둥이 그림에서 잡으셨고, 실물은 그 면이
          # 판에 **닿아** 있다. 어느 쪽이 틀렸나 — **이 선이다**:
          #   · 작업대1·2 의 가운데가 서로 807.7mm 라 **폭 800 과 스스로 맞는다**(둘 다 틀렸다면
