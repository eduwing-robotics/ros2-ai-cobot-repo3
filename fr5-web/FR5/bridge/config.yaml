          #   · 이 선은 뎁스 점구름 **선분 맞춤**이고 잔차 중앙이 **18mm** 다. 정밀도가 급이 다르다
          # 미는 양은 **닿는 구간의 최소 x**(y −995.3 에서 1032.8)가 1088.1 에 오게 잡았다 —
          # 그래서 y −995.3 에서 딱 닿고 그 위로는 벌어진다. *"벽과 안 붙은 면 350"* 과 같은 모양이다.
          # ⛔ **다시 안 쟀다 — 접촉에서 유도한 값이다.** 손목 뎁스로 재면 이 줄이 바뀐다.
          # ⚠ 이 변경은 게이트를 **55.3mm 느슨하게** 만든다(막던 자리를 덜 막는다). 여유 100 은 그대로 둔다.
          aMm: [1088.1, -995.3]
          bMm: [1155.1, -194.3]
          marginMm: 100         # 손끝만 판정하므로(D73 천장) 팔꿈치 몫까지 크게 잡는다
          seenZMm: [-142.0, 538.0]
          # ⚠ **물체의 높이가 아니라 카메라가 본 높이대다.** 뎁스 세로 화각 58.8° 와 거리
          #    670mm·카메라 높이 490mm 로 계산하면 볼 수 있는 범위가 112~868mm 인데 실측이
          #    200~880 이었다 — **화각 경계와 거의 같다.** 위아래로 더 있는지는 모른다.
          #    그래서 화면은 **바닥부터 이 값의 위끝까지** 그린다 (바닥에 선 판이라는 가정).
          # ⚠ 게이트는 높이를 아예 안 본다 — 위아래로 넘는 것까지 막는 쪽이 보수적이다
        - name: 먼 벽
