        # j1 을 5°씩 돌리며 76자세 + 사람이 수동으로 잡아 준 1자세 = 25만 점을 로봇 좌표로
        # 펴서 선분을 맞췄다. 옛 값(무한 평면 y<-1400)은 카트를 돌리며 통째로 거짓이 됐다.
