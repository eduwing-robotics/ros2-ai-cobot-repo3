# fr5-bridge 설정 — 로봇 개체가 바뀌면 여기만 바뀐다 (코드에 IP 를 박지 않는다 · D39)
# endpoint 는 서버 설정이다. 브라우저가 임의 IP 를 전달하지 않는다 (API-CONTRACT §프로필).
#
# settings 는 **브리지가 ARM 마다 로봇에 넣는 값**이다 (D53 · API-CONTRACT §로봇 안전 설정).
# 컨트롤러 충돌 감지는 기본으로 켜져 있지 않고 기본 민감도는 사람 접촉에 반응하지 않는다.
port: 5055
sample_ms: 33               # 상태 폴링 목표 주기 — 실측 27Hz 남짓 (unity-bridge-protocol §5)
robot_timeout_ms: 2000      # 어댑터 한 호출(read_state·stop)의 무응답 상한 (감사 #5).
                            # 블랙홀 단선이면 소켓이 매달려 스트림이 얼고 stop 이 늦는다 — 넘으면
                            # 연결 손실로 판정해 fail-closed. 완전한 해결(소켓 타임아웃)은 어댑터 몫
robot_connect_timeout_ms: 10000
                            # 프리플라이트(connect+GetSoftwareVersion+첫 20004 프레임)만 따로 잰다.
                            # **실측 3.0~3.8초** (2026-08-10) — 2000 을 같이 쓰면 로봇이 대답하기 전에
                            # 잘려 `asyncio.TimeoutError` 가 나고, 이 예외는 `str(e)` 가 비어 있어
                            # 사유가 통째로 사라진다(`reasons:[""]`). 사람이 누르는 1회성 동작이라
                            # 길어도 되지만, 스트림 동결 감지는 위 2000 을 그대로 유지한다
# 지점·궤적이 사는 곳. **배포 트리 밖**이다 (D45) — 안에 두면 rsync --delete 가 지운다.
# 배포 스크립트가 만든다 (`scripts/deploy/fr5-ubuntu.sh`).
data_dir: ~/fr5-data
# 받침(움직이는 것) 비전 추적을 켜는 스위치 — **id 를 주면 켜진다** (2026-08-27 · D149).
# ⛔ **지금은 비워 둔다.** 거치대2 는 **고정**이라 아래 작업영역 상자에 로봇이 짚은 값으로
# 들어갔다 — 카메라 사슬(08-27 에 태그가 물건에서 351mm 떨어져 있었다)보다 로봇(±0.02mm)이
# 정확하고, 태그가 총알에 가려도 안 흔들린다. **자주 옮겨지는 받침이 생기면** 그 태그 id 를
# 여기 적는다. 옛 코드는 `fixtureTags[0]` 을 집었는데 그건 목록 순서에 기대는 지뢰였다.
fixture_tag_id:
robots:
  - robotId: fr5-lab-a
    name: 실험실 FR5 (실기)
    adapter: fairino        # 순수 파이썬 SDK (fairino_sdk/ · D42)
    endpoint: 192.168.57.2:8080   # **컨트롤러 1번 포트** (2026-08-10 이설 · 08-12 복귀).
                                  # ⛔ **포트는 이동 거부의 원인이 아니었다** (2026-08-12 킬실험).
                                  # 0번(`58.2`)으로 되돌려 시험했는데 **`MoveJ` 가 똑같이 `code=172`** 였다.
                                  # 진짜 원인은 **펜던트의 전역 속도 오버라이드 0%** 다
                                  # (`172` = "Motion Speed Cannot Be 0" · SDK 오류표 정본).
                                  # ⚠ 0번으로 되돌리는 시험의 대가 — 그 경로가 **비상정지 박스를 경유**해서
                                  # 꽂는 순간 `6-2`(슬레이브 상태 불일치 · 리셋 불가)가 나 **컨트롤 박스 전원
                                  # 재투입**이 필요했다. 포트를 옮기는 것은 공짜가 아니다.
                                  # 실측: 1번 = `57.2`·1Gbps 직결 · 0번 = `58.2`·비상정지 박스 경유
                                  # ⚠ 펜던트 웹앱(`:80`)은 **58 대역에만** 붙는다 (D68) — 1번에서는 못 연다
                                  # ⚠ 0번으로 옮기면 주소도 `192.168.58.2` 로 되돌린다 (D63)
                                  # ⚠ **`robotId` 를 바꾸지 않는다.** 지점마다 `capturedRobotId` 가 박혀 있어
                                  # 프로필을 새로 만들면 같은 로봇인데도 기존 지점이 전부 「다른 개체」로 거부된다
                                  # ⚠ 펜던트 웹앱(`:80`)은 **58 대역에만** 붙는다 (D68) — 1번 포트에서는 그 UI 를
                                  # 못 연다. 물리 티치펜던트로 본다
                                  # 0번으로 되돌리면 주소도 `192.168.58.2` 로 되돌려야 한다 (D63)
                                  # 2026-08-05 58.2 실측 기록: 80·8080·20003·20004 열림 · ARP REACHABLE
    expectedModel: FR5-V1-002(V6.0)   # GetSoftwareVersion 실측 (2026-07-31) — 개체 정체성 검증값
    settings:
      # 그리퍼 0.6kg(대환 사양서) + D435 0.075kg(데이터시트 337029-017 Table 3-52).
      # 산술·천장·업그레이드 경로는 `docs/ref/arch/DEPTH-CAM.md` §하중 이 정본이다 (2026-08-10).
      # 여기 둘은 **손목 카메라가 달린 실기만** 이다 — 아래 mock 들은 카메라가 없어 0.6 그대로 둔다.
      payloadKg: 0.675
      # ponytail: 브래킷 질량 미포함 · 렌즈 위치를 카메라 무게중심으로 대용 · 82mm 을 +X 로 가정.
      # 셋 다 토크 오차 0.06 N·m 수준이라 잡음이다. 천장을 걷는 길은 컨트롤러 자동 하중 식별
      # (`LoadIdentifyMain` + `jt_cur_tor`) — 되면 이 세 근사가 한 번에 사라진다.
      cogMm: [9, 0, 59]
      installPos: 0         # 0=바닥 1=측면 2=천장
      collisionMode: 0      # 0=등급(1~10) 1=퍼센트
      # 등급은 작을수록 민감하다. 5 는 **실측 전 보수적 출발점**이고 확정값이 아니다 —
      # 실기에서 한 단계씩 낮추며 ①오탐 정지 없음 ②사람이 밀면 반응 지점을 찾는다 (GAP OPEN)
      collisionLevel: [5, 5, 5, 5, 5, 5]
      collisionStrategy: 2  # 2=에러 후 정지. 계속 실행(1)·리바운드(5)는 쓰지 않는다
      # 감지 **후** 어떻게 서느냐. SDK 기본인자라 안 적으면 벤더가 고른 값이 들어가고
      # 그중 셋이 범위의 가장 느슨한 끝이다 — 그래서 같은 값이라도 박는다 (계약 §로봇 안전 설정).
      # 조이는 건 실기 확인 뒤에 한다: 의미(정지 프로파일 vs 임계)를 벤더 문서가 안 준다
      collisionSafeTimeMs: 1000                    # 1000~2000 (여기가 최솟값)
      collisionSafeDistanceMm: 100                 # 1~150 · 조일 후보
      collisionSafeVelMmS: 250                     # 50~250 (여기가 최댓값) · 조일 후보
      collisionSafetyMargin: [10, 10, 10, 10, 10, 10]   # 1~10 (여기가 최댓값) · 조일 후보
      toolCoordId: 0        # ⚠ **이 값은 선언일 뿐 효력이 없다** — 브리지가 로봇에 안 넣는다
                            # (`SetToolCoord` 호출이 코드에 0건). 실기는 **tool 1 · user 1** 로 돈다
                            # (2026-08-05 실측 · 2026-08-10 `/state.coord` 재확인).
                            #
                            # ⛔ **여기를 실기에 적용하지 마라 — 게이트가 통째로 틀어진다.**
                            # 아래 작업영역 상자는 로봇이 **tool1/user1 로** 짚어 만든 값이다.
                            # 지금 활성 툴에는 Z 135mm 가 들어 있어(플랜지→핑거 끝 실측 일치),
                            # 툴 0 을 적용하면 TCP 가 그만큼 튀고 상판 판정이 거짓이 된다.
                            #
                            # ⚠ **옛 주석 "화면 TCP 도 플랜지 기준" 은 거짓이었다** (2026-08-10 정정) —
                            # 화면 TCP 는 오프셋이 적용된 값이다 (`API-CONTRACT.md` §좌표계 정의).
                            # 그리고 우리가 "툴 0 의 값" 이라 불러온 135 는 `GetCurToolCoord`
                            # (= **활성 툴**) 이 낸 값이라 **툴 1 의 값**이다. 툴 0 은 아무도 안 읽었다.
                            # 고치는 순서는 `GAP-MATRIX` 「TCP 기준점」 행 — 값보다 결정이 먼저다
    # 작업영역 — 조건 12 의 카테시안 절반. 손끝이 상판을 뚫거나 벽으로 가는 것을 막는다.
    # 실측 근거: docs/evidence/2026-08-05/workcell-measure.md (로봇이 직접 짚은 5점)
    # ⚠ **좌표계에 묶인 값이다.** 아래 frame 과 다르면 게이트가 거부한다 — 숫자가 거짓이 된다
    workspace:
      frame: {toolId: 1, userId: 1}
      # ⚠ **이 날짜는 값을 마지막으로 고친 날이다** — 라벨이 값보다 낡으면 다음 사람이
      # 「10일 낡은 자로 재고 있다」로 읽는다 (2026-08-27 에 실제로 그렇게 오독됐다).
      # 값을 고치면 여기도 같이 고친다. 갈래별 출처는 아래 상자 주석에 있다.
      measuredAt: "2026-08-18"
      rev: "08-18 작업대 셋 재측정 + 옆 판 55.3mm 이동"
      # 갈래별 — 카트 상판 08-05 로봇 접촉 · 벽 08-08 손목 뎁스 ·
      #          작업대 1·2·3 **08-18 재측정**(c9741cc) · 옆 판 **08-18 이동**(4631bd4)
      # ⛔ 작업대 상판 **높이**는 여전히 미측정이다 (`GAP-MATRIX` P1) — `topZMm` 은
      #    「짚은 셋 중 제일 높은 것 + 여유」인 **안전선**이라 낮추지 않는다
      boxes:
        # ── 거치대2 (조립 지그) — **로봇이 짚어서 넣었다** (2026-08-27 · D149)
        #
        # ⛔ **태그를 안 쓴다.** 받침 추적(D130)이 생긴 이유는 「자주 옮겨진다」였는데
        # 이 거치대는 **고정**이다(주인님 확정). 고정된 물건에 카메라 사슬을 태울 이유가 없다 —
        # 로봇 반복정밀도가 ±0.02mm 인데 08-27 에 태그 앵커(`id 18`)는 짚은 자리에서
        # **351mm** 떨어져 있었다(태그가 물건에 안 붙어 있었다. 붙일 자리도 없다).
        # 재투영 0.03px 이 「카메라가 태그를 잘 봤나」만 말하지 「그 태그가 그 물건 위에 있나」는
        # 말하지 않는다 — 그날 그걸 351mm 로 배웠다.
        #
        # 실측 (드래그 티칭 · 손목 수직 `rx −177.9` · 값 3회 재현):
        #   윗면 중앙 (120.9, −1195.1, −363.0) · 가로세로 122×122(줄자) · 두께 **27.9mm**
        #   ⭐ **2026-09-04 재확인** — 주인님이 윗면 중앙을 다시 짚어 **평면 4.6mm · 3D 5.3mm**.
        #      사람이 손으로 같은 점을 다시 짚은 것이라 이 정도가 정상이다. **안 움직였다.**
        #   ⭐ 두께는 **독립인 셋이 같은 답**이다 — 로봇 짚기 27.9 · 손목 뎁스 약 27 ·
        #      **자 28mm**(주인님 2026-09-04). 셋이 0.1~1mm 안이라 이 값은 다툴 것이 없다.
        #
        # ⚠ **작업대2 를 굴리면 이 값이 조용히 틀린다** (캐스터가 달려 있다). 판을 옮기면
        # 여기도 다시 짚는다 — `runbook/WORKCELL-MEASURE.md` 와 같은 규칙이다.
        - name: 거치대2
          xMm: [59.9, 181.9]      # 중앙 120.9 ± 61
          yMm: [-1256.1, -1134.1] # 중앙 -1195.1 ± 61
          # ⛔ **2026-09-04 — -363.0 → -306.1. 아침에 판 셋을 고치면서 여기를 빼먹었다.**
          # 판이 56.9mm 올라갈 때 그 위에 앉은 이 지그도 **같이 올라갔다.** 게이트만 옛
          # 높이에 남아, 실물 윗면 **57mm 가 무방비**였다 — 팔이 지그 위쪽을 그냥 지나간다.
          # ⭐ 새 값은 유도가 아니라 **직접 짚은 값**이다: 오늘 주인님이 이 윗면에 핑거 끝을
          #   닿게 두고 읽은 `-306.11` (그 측정이 아침에 판 높이를 고친 바로 그 측정이다).
          # ⭐ **검산** — 옛 값 -363.0 + 판 상승 56.9 = -306.1. 두 경로가 0.01mm 안에서 만난다.
          # ⚠ **판을 다시 옮기면 여기도 같이 옮긴다** — 이 값은 판 높이에 딸려 있다.
          #   그 딸림이 안 적혀 있어서 오늘 반나절 늦었다.
          topZMm: -306.1          # 짚은 값 그대로 — 여유는 아래 marginMm 가 든다
          marginMm: 5             # 122mm 줄자값의 반올림 + 짚은 오차를 덮는다.
                                  # 작업대(10)보다 작다 — 판이 아니라 **작은 물건**이라
                                  # 10 을 주면 상자가 실물보다 16% 커진다

        # 로봇이 올라앉은 카트 상판. **로봇과 같이 돌았으니 로봇 기준으로는 안 변했다**
        - name: 카트 상판
          xMm: [-16.1, 842.0]     # 긴 변 858 — 795 까지만 짚었고 나머지는 j1 한계로 못 갔다.
                                  # **넓은 쪽으로 잡는다** — 못 가는 데를 막아도 손해가 없다
          yMm: [-798.2, -210.9]   # 짧은 변 587.3 (자로 잰 580 대비 +7.3)
          topZMm: -345.8          # 세 점 퍼짐 1.9mm
          marginMm: 10            # 평면 오차 2mm + 짚은 오차 7mm 를 덮는다
        # ── 작업대 셋 ──────────────────────────────────────────────────────────
        # **2026-08-18 에 통째로 교체됐다** — 옛 795×453 한 판이 아니라 **800×500 세 판**이다.
        # 자리는 드래그 티칭으로 **판마다 정가운데를 한 점씩** 짚어 냈다 (`table-probe.py` ·
        # `docs/evidence/2026-08-18/table-3boards.md`). 크기가 정해져 있으므로 가운데 하나면
        # 네 모서리가 나온다 — 그래서 자리는 실측이지 유도가 아니다.
        #
        # ⭐ **3번은 90° 돌아 있다** — 1·2번은 카트 앞줄이고 3번만 카트 **왼쪽 옆구리**를 탄다.
        #   그래서 3번만 `500(x) × 800(y)` 이다. ㄱ자다.
        #
        # 교차검증 셋이 주인님 줄자와 맞았다(그래서 자리를 믿는다):
        #   2번이 카트와 닿는 가로면 296.5 (줄자 300) · 3번이 안 닿는 가로면 213.4 (줄자 200)
        #   1번이 옆 판과 안 닿는 면 301.8 (줄자 350)
        #   판끼리 틈 7.7 / 2.4mm · 판 뒷변과 카트 앞면(-798.2) 사이 1~2mm = 밀착
        #
        # ▶ **높이 — 셋을 같은 값 `-380.9` 로 맞췄다** (2026-08-18 · 주인님 "3판 다 925")
        #
        # ⛔ **줄자 925 를 그대로 넣지 않았다. 넣었으면 팔이 상판을 파고든다.**
        #   바닥 z = 카트상판 -345.8 − 카트높이 1000 = **-1345.8** → 925 는 **z -420.8** 이다.
        #   그런데 **로봇이 직접 짚은 가운데는 -396.3 / -390.9 / -397.7** 로 셋 다 그보다
        #   **23~30mm 높다.** -420.8 을 넣으면 금지바닥이 실제 상판보다 아래라 게이트가 조용한
        #   채로 팔이 판을 뚫는다. 이 파일이 같은 함정에 이미 두 번 걸렸다(위 카트 칸) —
        #   **바닥 기준 줄자는 게이트에 안 쓴다. 로봇이 로봇 좌표로 잰 값만 쓴다** (하드 룰 5).
        #
        #   그래서 공통값은 **짚은 셋 중 제일 높은 것(-390.9) + 기울기 여유 10** 이다.
        #   제일 높은 것을 고르는 이유 — 셋이 같은 높이라면 낮은 쪽을 고르는 순간 나머지 둘을
        #   파고든다. 여유 10 의 근거는 옛 상판 1.20°(800mm 폭이면 가운데↔귀 ±8.4mm)이고,
        #   1번은 두 점만으로도 **+x 쪽 0.86°** 가 보였다(x 260mm 에 z 3.9mm).
        #
        # ▶ **닫는 법** — 수평계로 판을 맞춘 뒤 판마다 귀퉁이 3점씩 더 짚는다
        #   (`python3 scripts/robot/table-probe.py --points 8`). 수평계 자체는 게이트 값을 못 낸다 —
        #   중력 기준이라 카트가 기울면 로봇 눈에는 여전히 기운다 (`table-probe.py` 머리말).
        # ▶ **붙이는 순서 = 고정점 하나에서 사슬로 민다** (2026-08-18 · 주인님 「밀착」 지시).
        #   1번이 고정점이다(오른쪽 면이 옆 판, 뒷변이 카트 앞면). 2번을 1번에 물리고,
        #   3번을 카트 왼쪽면에 물린다. 민 거리는 0.7~20.6mm — 손으로 짚은 가운데의 오차 안이다.
        #   ⛔ 그래도 **이제 순수 실측이 아니다.** 면은 스냅, 가운데는 실측이다.
        #
        # ⭐ **2026-09-04 — 주인님이 판 셋을 올렸다. 게이트가 46.9mm 위험한 쪽으로 낡았었다.**
        #   그리퍼 핑거 끝을 거치대2 윗면에 **닿게** 두고 읽은 값이 `-306.11` 이고,
        #   두께 27.9(증인 셋: 로봇 27.9 · 뎁스 약 27 · 자 28)를 빼면 그 판 상판이 **-334.01** 이다.
        #   ⭐ **검산** — 08-27 에 짚은 거치대2 윗면 `-363.0` 에서 같은 두께를 빼면 정확히
        #      `-390.9`, 즉 08-18 에 짚은 그 판 높이다. 사슬이 한 치도 안 어긋난다.
        #   → 올라간 양 **+56.9mm**. 같은 규약(제일 높은 것 + 여유 10)으로 **-324.0**.
        #
        # ⚠ **셋 중 하나만 쟀다.** 거치대2 가 앉은 판이다. 나머지 둘은 주인님의 「셋 다 맞췄다」에
        #   기댄다 — 여유 10 이 작은 편차를 삼키지만 **완전한 실측은 아니다.**
        #   ▶ 닫는 법은 그대로 — `python3 scripts/robot/table-probe.py --points 8` 로 판마다 짚는다.
        # ⚠ **카트와 「일치」가 아니다** — 카트 상판 -345.8 보다 작업대가 **11.8mm 높다**.
        - name: 작업대1
          xMm: [288.1, 1088.1]    # 가운데 x 688.1 ± 400 — 오른쪽 면이 옆 판에 닿는다
          yMm: [-1298.2, -798.2]  # 뒷변을 카트 앞면(-798.2)에 **딱 물렸다** — 짚은 가운데
                                  # -1047.1 에서 1.1mm 민 값이다. 안 밀면 카트 상자를 1.1mm
                                  # 파고들고, 쌍둥이가 상자를 **보정 없이 그대로 세우므로**
                                  # 그림에서 두 판이 겹쳐 보인다 (workspace.js:151). 깊이 500 유지
          topZMm: -324.0          # ⛔ 미검증 — 셋 공통값. 근거는 아래 ▶높이 절
          marginMm: 10
        - name: 작업대2
          xMm: [-511.9, 288.1]    # 오른쪽 면을 1번 왼쪽 면(288.1)에 **물렸다** — +7.7 밀었다
          yMm: [-1298.2, -798.2]  # 뒷변을 카트 앞면(-798.2)에 물렸다 — +1.7. 깊이 500 유지
          topZMm: -324.0          # ⛔ 미검증 — 셋 공통값 (이 판이 제일 높았다)
          marginMm: 10
        - name: 작업대3
          xMm: [-516.1, -16.1]    # ⭐ 90° 돌았다 — 여기가 500. 오른쪽 면을 카트 왼쪽면(-16.1)에
                                  # **물렸다** — +20.6 밀었다
          yMm: [-798.2, 1.8]      # 여기가 800 — 뒷변이 카트 앞면·2번 앞면과 한 줄(-798.2)이다.
                                  # +0.7 밀었다. 카트 옆구리를 따라 앞으로 뻗는다
          topZMm: -324.0          # ⛔ 미검증 — 셋 공통값. 짚은 값은 -397.7 이었다
          marginMm: 10

