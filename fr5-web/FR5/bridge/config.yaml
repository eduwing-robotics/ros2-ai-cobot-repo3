      # 이어 붙이는 둘째 출처를 갖는다. 거치대엔 바퀴가 없으니 **못 보면 그냥 선다.**
      # ⭐ **2026-09-04 — `anchor` → `color`.** 주인님 *"애초에 글로벌캠에 잡히는데"*.
      # `anchor` 는 **종이 태그**를 따라간다. 태그가 물건에 안 붙어 있으면 물건을 옮겨도
      # 팔은 안 따라간다 — 실제로 그랬다. `color` 는 영상에서 **물건을 직접** 찾는다.
      # ⚠ 되돌리려면 `anchor` — 색이 안 통하는 물건(검정 등)이면 그쪽이 맞다.
      # ⭐ **2026-09-04 저녁 — `color` → `wrist` (D177).** 앞의 셋은 전부 **폰 산출물**이라
      # 폰이 꺼진 71분 동안 표적이 통째로 얼어붙었다. `wrist` 는 손목 뎁스가 직접 재므로
      # 폰이 없어도 돈다. ⛔ 대신 **보고 있을 때만** 안다(2단) — 화각에 넣는 1단은 따로다.
