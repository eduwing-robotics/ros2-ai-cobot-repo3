# tb-bridge 설정 — WiFi·로봇이 바뀌면 여기만 바뀐다 (코드에 IP 를 박지 않는다 · D29)
# port 는 기동 스크립트(tb-dev.sh · tb-run.sh)가 읽는 정본이다 — 여기만 고치면 따라온다.
# 5055 는 같은 PC 의 FR5 브리지가 쓴다 (D80). 바꾸면 vite dev 프록시도 같이 (consts.sh 가 잡는다)
port: 5056
robots:
  - id: tb3_1
    ros_domain_id: 210      # 미대조 — ssh config 메모는 "2 변경 예정·현재 210" (2026-06-30)
  - id: tb3_2
    ros_domain_id: 210      # **실기 대조 2026-08-18** — `_robot_bringup_ns.sh` 기본값. 옛 repo2 값 1 은 틀렸다.
                            # ⚠ rclpy 는 도메인이 프로세스 단위(env ROS_DOMAIN_ID)라 이 값은 기록용이다 —
                            # 실제 적용은 브리지 기동 env (파이 ~/start-bridge.sh · evidence/2026-08-18)
    # 지오펜스 — 작업대1·2 주행 + 원점 뒤 카트·작업대3 받침의 합집합
    # (TB-CONTRACT §지오펜스 · 2026-09-09 주인님 현장 확인).
    # 좌표는 FR5 config 의 네 지지면을 AMR_HOME(833.1,-948.2,180°)으로 odom 환산했다.
    # 2026-09-09 front200 실기 뒤 163으로 복구했다 — 다음 경로는 실도착 약 400mm를 노리는 front430.
    # 원점 출발 때만 쓴 150 완화는 다른 경로·회전에 재사용하지 않는다.
    geofence:
      frame: odom
      inset_mm: 163
      polygon_mm:
        - [1345.0, 350.0]     # 작업대1·2 앞 왼쪽
        - [-255.0, 350.0]     # 작업대1·2 앞 오른쪽
        - [-255.0, -150.0]    # 작업대1 뒤 오른쪽
        - [-8.9, -150.0]      # 카트 오른쪽 아래
        - [-8.9, -737.3]      # 카트 오른쪽 위
        - [849.2, -737.3]     # 카트·작업대3 위 접점
        - [849.2, -950.0]     # 작업대3 오른쪽 위
        - [1349.2, -950.0]    # 작업대3 왼쪽 위
        - [1349.2, -150.0]    # 작업대3 왼쪽 아래
        - [1345.0, -150.0]    # 작업대2 뒤 왼쪽
safety:
  linear_cap_mm_s: 150      # 버거 물리 최대 220
  angular_cap_deg_s: 60
disk_min_free_gb: 2         # 이 밑이면 record/start 거부 (감사 R5)
