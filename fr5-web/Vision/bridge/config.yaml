# cam-bridge 설정 — 카메라·해상도가 바뀌면 여기만 바뀐다 (코드에 숫자를 박지 않는다 · D29).
# port 는 기동 스크립트(cam-run.sh)가 읽는 정본이다.
# 같은 PC 에서 5055 는 FR5 · 5056 은 터틀봇이 쓴다 (D80) — 카메라는 네 번째다.
# **5057 을 안 쓴다** (2026-08-07): splat 뷰어(`~/splat-work/viewer` 의 `python3 -m http.server`)가
# 쥐고 있었다. 남의 작업이라 죽이지 않고 비켰다 — 관문 셋이 한 PC 에 사는 이상 포트는 선착순이다.
port: 5058
camera_id: wrist-d435

# 관문이 FR5 브리지와 같은 기계면 `null` — 시계 차이가 0 인 게 정의다.
# 파이로 옮기면 여기에 브리지 주소를 적고 **실제로 재야** 한다 (계약 §clockSkewMs).
clock_peer: null

depth:
  # **접근 구간이 기본이다** — 여기서 물체를 재고 앵커를 뜬다 (DEPTH-CAM.md §그래서 이렇게 쓴다).
  # **전환점은 손끝 아래 15cm** — 그 위는 848x480, 아래는 424x240 (2026-08-05 실측:
  # 848 은 152mm 꺼짐 / 236mm 켜짐). 전환 자체는 아직 없다 (main.py §천장).
  resolution: 848x480
  fps: 30
  # **실측으로 정했다** — `docs/evidence/2026-08-05/cam-fov.md` §높이 스윕. 87~333mm 를 네 모드로
  # 훑어 **죽은 상태 0.0~7.6% / 산 상태 70~85%, 사이가 통째로 비어 있다**(가장 큰 틈 3.2→53.1,
  # 49.9%p). 그 표도 **중앙 1/3** 이라 여기 정의와 같다. 틈 한가운데라 어디에 놔도 같은 판정이
  # 나오지만, 경계에서 흔들릴 이유가 없는 값을 고른다.
  # ⚠ 유일한 애매한 표본은 640x360@138mm 의 53.1% 다 — 제 Min-Z(150mm)보다 가까운 자리라
  # **모드를 잘못 고른 것**이지 깊이가 나쁜 게 아니다. 0.50 이면 이것도 통과시키는데, 그 처방은
  # 임계값이 아니라 **해상도 전환**이다(같은 자리에서 424x240 은 82.8% 를 낸다).
  valid_ratio_center_min: 0.50
  # ── 후처리 필터 (2026-08-27 · D150) — **스냅샷(`depth/frame`)에만** 걸린다.
  #
  # ⛔ **유효율은 원본으로 잰다.** 필터본으로 재면 `hole_filling` 이 지어낸 화소까지 「유효」로
  # 세어 사각지대 판정이 거짓이 된다 — **못 보는 자리를 본다고 말하는 화면**이 된다.
  #
  # ⭐ **왜 켜나** — 황동 탄피처럼 반짝이는 표면은 **프레임마다 다른 곳이 빠진다.**
  # 08-27 실측: 받침 영역 **21%가 무효**였고 세운 총알 몸통이 듬성듬성 잡혔다.
  # `temporal` 은 **본 적 있는 값**으로 메우는 것이라 지어내는 것과 다르다.
  #
  # ⛔ **`hole_filling` 은 안 켰다** — 그건 이웃 화소에서 **지어낸다.** 검출이 그 위에서 물체를
  # 찾으면 없는 물체가 나온다. 필요해지는 날 그 대가를 알고 켠다.
  # 순서가 뜻이 있다 (RealSense 권장): decimation → spatial → temporal.
  filters: [spatial, temporal]
  # ── 적외선 원본 (2026-08-27 · D151) — 계약 §적외선 원본. `[]` 면 안 연다.
  # 깊이와 **같은 이미저·같은 해상도**라 추가 대역이 작다. 1=왼쪽(깊이의 원점) · 2=오른쪽.
  # ⛔ **판정에 안 쓴다** — 유효율은 여전히 깊이 원본이 낸다. 여기는 사람이 원인을 가르는 창이다.
  infrared: [1, 2]

color:
  # **4:3 을 쓰지 않는다** (DEPTH-CAM.md §화각) — 센서를 가로로 오려내 화각이 15° 줄고,
  # 컬러 640x480 이면 파지점이 손끝 7.5cm 위에서 사라진다. `rs-save-to-disk` 의 기본값이
  # 하필 그것이었다 — 기본값을 믿으면 안 된다.
  resolution: 848x480
  fps: 30
  preview_width: 424
  preview_quality: 70

# 깊이 노브 — 2026-08-11 개설. **기본값은 실기에서 읽은 지금 값 그대로**라 이 절을 더해도
# 동작이 안 바뀐다(무변화). 등재·범위·함정은 `docs/ref/arch/STACK.md` §깊이 노브가 정본이다.
# `null` 은 "건드리지 않는다" 다 — 0 이나 기본값을 박아 넣는 것과 다르다.
tuning:
  # ⛔ **자동노출을 명시로 켠다** (2026-08-27 · 실측에서 물렸다). 노출 노브는 **장치에 남는다** —
  # 한 번 끄고 값을 박으면 파이프라인을 다시 열어도 그대로다. 08-27 에 노출 20000 을 시험한 뒤
  # 되돌리는 줄이 없어 그 뒤 모든 측정이 **유효율 71.6% → 26.7%** 로 조용히 무너졌고,
  # 「채택안이 나빠졌다」로 읽을 뻔했다. **끈 것은 명시로 켠다.**
  enable_auto_exposure: 1
  # 0~360 · step 30. 올리면 구멍이 준다 — 황동 정반사에 직접 걸린다
  # 150 → 360 (2026-08-27). 정반사 표면에서 도트가 덜 돌아오는 것을 힘으로 밀어 본 값.
  # ⚠ 단독 효과는 작았다(총알대 화소 118→140) — 아래 `disparity_shift` 가 지배항이다
  laser_power: 360
  # 0=custom · 1=default · 2=hand · 3=high_accuracy · 4=high_density · 5=medium_density
  # ⚠ 지금이 **custom(0)** 이다. 6(remove_ir_pattern)은 이 기기 범위 밖이다
  visual_preset: 0
  # 미터. 0.001=1mm. 0.0001 이면 0.1mm 분해능이지만 최대 사거리가 6.5m 로 준다
  depth_units: 0.001
  # ⚠ **이걸 0 이 아닌 값으로 두면 위 `min_z_mm` 표가 무효가 된다** (표는 shift 0 전제 ·
  # STACK.md §깊이 노브). 바꾸려면 그 모드의 Min-Z 를 실측으로 다시 내야 한다
  # ⭐ **0 → 50 (2026-08-27 채택).** 08-11 이 「보류」로 둔 노브인데 **세워 꽂은 총알에는
  # 이게 답이었다** — 총알 거리대 화소 **118 → 1360~1542 (12배)**.
  # ⛔ **대가를 정확히 적는다: 유효율 87.8% → 71.6%.** shift 는 먼 거리를 버리고 가까운
  # 거리를 얻는 거래다. **100 은 과하다** — 유효율이 **2.4%** 로 통째로 무너진다(실측).
  # ⚠ 08-11 이 보류한 이유(「전역 설정이라 6모드 표를 다 다시 내야 한다」)는 그대로다 —
  # 지금은 848×480 한 모드만 재고 채택했다. 다른 모드로 갈 때 다시 잰다.
  disparity_shift: 50

# 이 위는 포화 쓰레기(Z 65535)이거나 작업대 밖이다 (계약 §카메라 기본 4000mm)
max_mm: 4000

# 해상도 → Min-Z. 정본은 `DEPTH-CAM.md` §Min-Z (Intel 데이터시트 337029-017 Table 4-11).
# **여기 없는 해상도는 판정 불가**다 — 0 이 아니라 없음으로 다뤄 fail-closed 로 간다.
min_z_mm:
  1280x720: 280
  848x480: 195
  640x480: 175
  640x360: 150
  480x270: 120
  424x240: 105
